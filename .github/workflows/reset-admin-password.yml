name: One-off admin password reset

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "Neues Passwort für das admin-Login"
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: postgresql-client installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release python3-pip
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pip install --break-system-packages bcrypt

      - name: Hash berechnen und Passwort setzen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: |
          HASH=$(python3 -c "import bcrypt, os; print(bcrypt.hashpw(os.environ['NEW_PASSWORD'].encode(), bcrypt.gensalt()).decode())")
          cat > reset.sql << SQLEOF
          UPDATE users SET password_hash = '$HASH' WHERE username = 'admin';
          SQLEOF
          /usr/lib/postgresql/18/bin/psql "$DATABASE_URL" -f reset.sql
