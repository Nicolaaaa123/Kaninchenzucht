name: Nightly database backup to OneDrive

on:
  schedule:
    - cron: "0 2 * * *" # täglich um 02:00 UTC
  workflow_dispatch: {} # manuell auslösbar zum Testen, unter "Actions" im Repo

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: postgresql-client (Version 18, passend zu Neon) und rclone installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Datenbank-Dump erstellen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges > "backup/kaninchenzucht-$(date +%Y-%m-%d).sql"

      - name: rclone (OneDrive-Zugang) einrichten
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Dump nach OneDrive hochladen
        run: rclone copy backup/ onedrive:Kaninchenzucht-Backups --progress

      - name: Backups älter als 30 Tage auf OneDrive löschen
        run: rclone delete onedrive:Kaninchenzucht-Backups --min-age 30d
