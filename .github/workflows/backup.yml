name: Nightly database backup to OneDrive

on:
  schedule:
    - cron: "0 2 * * *" # täglich um 02:00 UTC
  workflow_dispatch: {} # manuell auslösbar zum Testen, unter "Actions" im Repo

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: postgresql-client und rclone installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Datenbank-Dump erstellen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --no-privileges > "backup/kaninchenzucht-$(date +%Y-%m-%d).sql"

      - name: rclone (OneDrive-Zugang) einrichten
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Dump nach OneDrive hochladen
        run: rclone copy backup/ onedrive:Kaninchenzucht-Backups --progress

      - name: Backups älter als 30 Tage auf OneDrive löschen
        run: rclone delete onedrive:Kaninchenzucht-Backups --min-age 30d
